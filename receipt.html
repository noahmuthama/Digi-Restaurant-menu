<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>receipt page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-sky-950 text-sky-100 pt-16 pb-20">

    <!-- Top nav bar -->
    <nav class="fixed top-0 w-full flex justify-between p-4 bg-sky-900 text-white">
        <a href="order.html">order</a>
        <span>receipt</span>
        <button>Notify</button>
    </nav>

   

         <main class="px-4 max-w-md mx-auto">
        <h1 class="text-2xl font-bold my-4">Receipt</h1>

        <p id="empty">No order to pay for.</p>

        <div id="bill" class="hidden bg-sky-900 p-4 rounded-xl shadow-lg space-y-2">
            <p id="r-name" class="text-xl font-semibold"></p>
            <p id="r-price" class="text-amber-400 font-medium"></p>
            <p id="r-table" class="text-sm text-sky-300"></p>
            <button id="pay" class="w-full py-3 bg-sky-600 rounded-lg font-semibold">Pay</button>
        </div>

        <p id="done" class="hidden text-green-400 font-semibold">Payment received Thank you!</p>
        <h2 class="text-xl font-bold mt-6 mb-2">Payment history</h2>
       <div id="history" class="space-y-2"></div>
    </main>

       <!-- Bottom nav bar -->
    <nav class="fixed bottom-0 w-full flex justify-around p-4 bg-sky-900 text-white">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="order.html">Order</a>
        <a href="waiter.html">Waiter</a>
        <a href="receipt.html">Receipt</a>
    </nav>

     <script>
        const order = JSON.parse(localStorage.getItem("order"));

        if (order) {
            document.getElementById("empty").style.display = "none";
            document.getElementById("bill").style.display = "block";
            document.getElementById("r-name").textContent = order.name;
            document.getElementById("r-price").textContent = order.price;
            document.getElementById("r-table").textContent = order.restaurant + ", Table " + order.table;
        }

        function showHistory() {
    const receipts = JSON.parse(localStorage.getItem("receipts")) || [];
    let html = "";
    receipts.reverse().forEach(function (r) {
        html += '<div class="bg-sky-900 p-3 rounded-lg">' +
            '<p class="font-semibold">' + r.name + '</p>' +
            '<p class="text-amber-400">' + r.price + '</p>' +
            '<p class="text-sm text-sky-300">' + r.restaurant + ', Table ' + r.table + ', paid at ' + r.paidAt + '</p>' +
            '</div>';
    });
    document.getElementById("history").innerHTML = html || "No payments yet.";
}

                document.getElementById("pay").addEventListener("click", function () {
            // add this payment to the list of all payments
            const receipts = JSON.parse(localStorage.getItem("receipts")) || [];
            order.paidAt = new Date().toLocaleTimeString();
            receipts.push(order);
            localStorage.setItem("receipts", JSON.stringify(receipts));
            localStorage.removeItem("order");

            document.getElementById("bill").style.display = "none";
            document.getElementById("done").style.display = "block";
            showHistory();
        });
        showHistory();
    </script>



    
</body>
</html>
